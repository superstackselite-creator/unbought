<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Primary Meta Tags -->
  <title>UnBought | Verified Community Reviews & Site Ratings</title>
  <meta name="title" content="UnBought | Verified Community Reviews & Site Ratings" />
  <meta name="description" content="Crowdsourced, verified website reviews and trust ratings driven by real people. Check site authenticity before you buy." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://unbought.com/" />

  <!-- Open Graph / Facebook / Link Previews -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://unbought.com/" />
  <meta property="og:title" content="UnBought | Verified Community Reviews" />
  <meta property="og:description" content="Authentic site reviews driven by real people. Check domain ratings and post verified consumer feedback." />
  <meta property="og:image" content="https://unbought.com/og-image.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://unbought.com/" />
  <meta property="twitter:title" content="UnBought | Verified Community Reviews" />
  <meta property="twitter:description" content="Authentic site reviews driven by real people. Check domain ratings and post verified consumer feedback." />
  <meta property="twitter:image" content="https://unbought.com/og-image.png" />

  <!-- Schema.org JSON-LD for Search Engines -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "UnBought",
      "url": "https://unbought.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://unbought.com/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen flex flex-col">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUPABASE_URL = "https://dmtayqxefmzezimwdezw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_pBqZSQFg0UyIsiWkEJz5Jw_F-4TChrX";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function UnBoughtApp() {
      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [sites, setSites] = useState([]);
      const [reviews, setReviews] = useState([]);
      const [loading, setLoading] = useState(true);

      const [searchQuery, setSearchQuery] = useState('');
      const [currentDomain, setCurrentDomain] = useState(null);

      // Modal Controls
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup'
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [isReviewModalOpen, setIsReviewModalOpen] = useState(false);

      // Auth Inputs
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authDisplayName, setAuthDisplayName] = useState('');
      const [authError, setAuthError] = useState('');

      // User Preferences State
      const [prefDisplayName, setPrefDisplayName] = useState('');
      const [prefNotifications, setPrefNotifications] = useState(true);

      // Review Form State
      const [newDomainInput, setNewDomainInput] = useState('');
      const [newRating, setNewRating] = useState(5);
      const [newTitle, setNewTitle] = useState('');
      const [newComment, setNewComment] = useState('');

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session) fetchProfile(session.user.id);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session) fetchProfile(session.user.id);
          else setProfile(null);
        });

        fetchData();
        return () => subscription.unsubscribe();
      }, []);

      const fetchProfile = async (userId) => {
        const { data } = await supabase.from('profiles').select('*').eq('id', userId).single();
        if (data) {
          setProfile(data);
          setPrefDisplayName(data.display_name || '');
          setPrefNotifications(data.email_notifications ?? true);
        }
      };

      const fetchData = async () => {
        setLoading(true);
        const { data: sitesData } = await supabase.from('sites').select('*').order('created_at', { ascending: false });
        const { data: reviewsData } = await supabase.from('reviews').select('*').order('created_at', { ascending: false });
        setSites(sitesData || []);
        setReviews(reviewsData || []);
        setLoading(false);
      };

      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (authMode === 'signup') {
          const { error } = await supabase.auth.signUp({
            email: authEmail,
            password: authPassword,
            options: { data: { display_name: authDisplayName } }
          });
          if (error) setAuthError(error.message);
          else {
            alert('Account created! Please check your email inbox to verify your account.');
            setIsAuthModalOpen(false);
          }
        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email: authEmail,
            password: authPassword
          });
          if (error) setAuthError(error.message);
          else setIsAuthModalOpen(false);
        }
      };

      const handleSignOut = async () => {
        await supabase.auth.signOut();
        setIsProfileModalOpen(false);
      };

      const handleSavePreferences = async (e) => {
        e.preventDefault();
        if (!session) return;
        const { error } = await supabase.from('profiles').update({
          display_name: prefDisplayName,
          email_notifications: prefNotifications,
          updated_at: new Date()
        }).eq('id', session.user.id);

        if (error) alert("Failed saving preferences: " + error.message);
        else {
          alert("Preferences successfully updated!");
          fetchProfile(session.user.id);
          setIsProfileModalOpen(false);
        }
      };

      const cleanDomain = (url) => url.toLowerCase().replace(/^(?:https?:\/\/)?(?:www\.)?/, '').split('/')[0].trim();

      const handleAddReview = async (e) => {
        e.preventDefault();
        const targetDomain = cleanDomain(newDomainInput || currentDomain);
        if (!targetDomain || !newTitle || !newComment) return;

        const authorName = profile?.display_name || (session ? session.user.email.split('@')[0] : 'Anonymous Consumer');

        const newReviewPayload = {
          domain: targetDomain,
          author: authorName,
          rating: Number(newRating),
          title: newTitle.trim(),
          comment: newComment.trim(),
          user_id: session?.user?.id || null,
          verified_buyer: !!session,
          helpful_count: 0
        };

        const existingSite = sites.find(s => s.domain.toLowerCase() === targetDomain);
        if (!existingSite) {
          await supabase.from('sites').insert([{
            domain: targetDomain,
            name: targetDomain.split('.')[0].toUpperCase(),
            category: 'General Online Business',
            verified: false
          }]);
        }

        const { error } = await supabase.from('reviews').insert([newReviewPayload]);
        if (error) alert("Error saving review: " + error.message);
        else {
          fetchData();
          setCurrentDomain(targetDomain);
          setIsReviewModalOpen(false);
          setNewTitle('');
          setNewComment('');
        }
      };

      const handleHelpfulVote = async (reviewId, currentCount) => {
        await supabase.from('reviews').update({ helpful_count: currentCount + 1 }).eq('id', reviewId);
        fetchData();
      };

      const domainStats = useMemo(() => {
        if (!currentDomain) return null;
        const siteReviews = reviews.filter(r => r.domain.toLowerCase() === currentDomain.toLowerCase());
        const total = siteReviews.length;
        if (total === 0) return { total: 0, avg: '0.0', siteReviews: [] };
        const sum = siteReviews.reduce((acc, r) => acc + r.rating, 0);
        return { total, avg: (sum / total).toFixed(1), siteReviews };
      }, [currentDomain, reviews]);

      return (
        <div class="flex-grow flex flex-col">
          {/* HEADER */}
          <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur border-b border-slate-800">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
              <div onClick={() => { setCurrentDomain(null); setSearchQuery(''); }} class="flex items-center gap-2.5 cursor-pointer">
                <div class="w-9 h-9 bg-emerald-500 rounded-lg flex items-center justify-center font-black text-slate-950 text-xl shadow-lg shadow-emerald-500/20">★</div>
                <span class="text-xl font-bold text-white">Un<span class="text-emerald-400">Bought</span></span>
              </div>

              <form onSubmit={(e) => { e.preventDefault(); if (searchQuery) setCurrentDomain(cleanDomain(searchQuery)); }} class="hidden md:flex flex-1 max-w-md relative">
                <input
                  type="text"
                  placeholder="Search site domain..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  class="w-full bg-slate-950 border border-slate-700/80 rounded-lg py-2 pl-4 pr-10 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                />
                <button type="submit" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">🔍</button>
              </form>

              <div class="flex items-center gap-3">
                <button
                  onClick={() => { setNewDomainInput(currentDomain || ''); setIsReviewModalOpen(true); }}
                  class="px-3.5 py-1.5 bg-emerald-500 text-slate-950 font-semibold text-xs sm:text-sm rounded-lg hover:bg-emerald-400"
                >
                  + Write Review
                </button>

                {session ? (
                  <button
                    onClick={() => setIsProfileModalOpen(true)}
                    class="px-3.5 py-1.5 bg-slate-800 border border-slate-700 text-slate-200 text-xs sm:text-sm font-semibold rounded-lg hover:bg-slate-700 flex items-center gap-1.5"
                  >
                    👤 {profile?.display_name || session.user.email.split('@')[0]}
                  </button>
                ) : (
                  <button
                    onClick={() => { setAuthMode('login'); setAuthError(''); setIsAuthModalOpen(true); }}
                    class="px-3.5 py-1.5 bg-slate-800 text-white text-xs sm:text-sm font-semibold rounded-lg border border-slate-700 hover:bg-slate-700"
                  >
                    Log In / Sign Up
                  </button>
                )}
              </div>
            </div>
          </header>

          <main class="flex-grow">
            {!currentDomain ? (
              <div>
                <section class="py-16 px-4 text-center border-b border-slate-800/80 bg-gradient-to-b from-slate-900 to-slate-950">
                  <div class="max-w-3xl mx-auto">
                    <h1 class="text-4xl sm:text-5xl font-extrabold text-white mb-4">
                      Authentic site reviews by <span class="text-emerald-400">real people.</span>
                    </h1>
                    <p class="text-slate-400 mb-8">
                      Sign in to manage preferences, store your identity, and write verified trust ratings.
                    </p>
                    <form onSubmit={(e) => { e.preventDefault(); if (searchQuery) setCurrentDomain(cleanDomain(searchQuery)); }} class="flex flex-col sm:flex-row gap-2 max-w-xl mx-auto">
                      <input
                        type="text"
                        required
                        placeholder="Enter domain (e.g. shopify.com)..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500"
                      />
                      <button type="submit" class="px-6 py-3 bg-emerald-500 text-slate-950 font-bold rounded-xl hover:bg-emerald-400">Search</button>
                    </form>
                  </div>
                </section>

                <section class="max-w-7xl mx-auto px-4 py-12">
                  <h2 class="text-xl font-bold text-white mb-6">Recently Active Domains</h2>
                  {loading ? (
                    <div class="text-slate-500">Loading database...</div>
                  ) : sites.length === 0 ? (
                    <div class="text-center py-8 text-slate-500 border border-dashed border-slate-800 rounded-2xl">
                      No domains tracked yet. Search a domain above to submit the first review!
                    </div>
                  ) : (
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                      {sites.map(site => {
                        const siteRevs = reviews.filter(r => r.domain.toLowerCase() === site.domain.toLowerCase());
                        const avg = siteRevs.length ? (siteRevs.reduce((a, b) => a + b.rating, 0) / siteRevs.length).toFixed(1) : 'New';
                        return (
                          <div
                            key={site.id}
                            onClick={() => setCurrentDomain(site.domain)}
                            class="bg-slate-900 border border-slate-800 rounded-xl p-5 cursor-pointer hover:border-emerald-500/50 transition flex justify-between items-center"
                          >
                            <div>
                              <h3 class="font-bold text-white">{site.name}</h3>
                              <p class="text-xs text-slate-400 font-mono">{site.domain}</p>
                            </div>
                            <div class="text-right">
                              <span class="text-emerald-400 font-bold text-sm">★ {avg}</span>
                              <p class="text-[10px] text-slate-500">{siteRevs.length} reviews</p>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </section>
              </div>
            ) : (
              <div class="max-w-7xl mx-auto px-4 py-8">
                <button onClick={() => setCurrentDomain(null)} class="text-xs text-slate-400 hover:text-emerald-400 mb-6">← Back to Search</button>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 mb-8 flex flex-col sm:flex-row items-center justify-between gap-4">
                  <div>
                    <h1 class="text-2xl font-bold text-white">{currentDomain}</h1>
                    <p class="text-xs text-slate-400">Verified Consumer Feedback</p>
                  </div>
                  <div class="flex items-center gap-4">
                    <div class="bg-slate-950 border border-slate-800 px-5 py-2 rounded-xl text-center">
                      <div class="text-2xl font-bold text-emerald-400">{domainStats?.avg}</div>
                      <div class="text-[10px] text-slate-500 uppercase">{domainStats?.total} Ratings</div>
                    </div>
                    <button onClick={() => { setNewDomainInput(currentDomain); setIsReviewModalOpen(true); }} class="px-5 py-3 bg-emerald-500 text-slate-950 font-bold text-sm rounded-xl hover:bg-emerald-400">
                      Rate Domain
                    </button>
                  </div>
                </div>

                <div class="space-y-4">
                  {domainStats?.siteReviews.length === 0 ? (
                    <div class="text-center py-8 text-slate-500 border border-dashed border-slate-800 rounded-xl">
                      No reviews submitted for {currentDomain} yet. Be the first to post!
                    </div>
                  ) : (
                    domainStats?.siteReviews.map(rev => (
                      <div key={rev.id} class="bg-slate-900 border border-slate-800 rounded-xl p-5 space-y-2">
                        <div class="flex items-center justify-between">
                          <div class="flex items-center gap-2">
                            <span class="font-bold text-sm text-slate-200">{rev.author}</span>
                            {rev.user_id && (
                              <span class="px-2 py-0.5 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[10px] font-semibold rounded-full">✓ Verified User</span>
                            )}
                          </div>
                          <span class="text-emerald-400 font-bold text-sm">{'★'.repeat(rev.rating)}</span>
                        </div>
                        <h4 class="font-semibold text-white">{rev.title}</h4>
                        <p class="text-sm text-slate-300">{rev.comment}</p>
                        <div class="pt-2 flex justify-end border-t border-slate-800">
                          <button onClick={() => handleHelpfulVote(rev.id, rev.helpful_count || 0)} class="text-xs text-slate-400 hover:text-white bg-slate-800 px-2.5 py-1 rounded">
                            👍 Helpful ({rev.helpful_count || 0})
                          </button>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}
          </main>

          {/* AUTHENTICATION MODAL */}
          {isAuthModalOpen && (
            <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 relative">
                <button onClick={() => setIsAuthModalOpen(false)} class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                <div class="flex gap-4 border-b border-slate-800 mb-6">
                  <button onClick={() => { setAuthMode('login'); setAuthError(''); }} class={`pb-2 text-sm font-bold ${authMode === 'login' ? 'text-emerald-400 border-b-2 border-emerald-400' : 'text-slate-400'}`}>Log In</button>
                  <button onClick={() => { setAuthMode('signup'); setAuthError(''); }} class={`pb-2 text-sm font-bold ${authMode === 'signup' ? 'text-emerald-400 border-b-2 border-emerald-400' : 'text-slate-400'}`}>Create Account</button>
                </div>

                {authError && <div class="mb-4 text-xs bg-red-500/10 border border-red-500/30 text-red-400 p-2.5 rounded-lg">{authError}</div>}

                <form onSubmit={handleAuth} class="space-y-4">
                  {authMode === 'signup' && (
                    <input
                      type="text"
                      required
                      placeholder="Display Name"
                      value={authDisplayName}
                      onChange={(e) => setAuthDisplayName(e.target.value)}
                      class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  )}
                  <input
                    type="email"
                    required
                    placeholder="Email Address"
                    value={authEmail}
                    onChange={(e) => setAuthEmail(e.target.value)}
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                  />
                  <input
                    type="password"
                    required
                    placeholder="Password"
                    value={authPassword}
                    onChange={(e) => setAuthPassword(e.target.value)}
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                  />
                  <button type="submit" class="w-full py-2.5 bg-emerald-500 text-slate-950 text-sm font-bold rounded-lg hover:bg-emerald-400">
                    {authMode === 'login' ? 'Sign In' : 'Register Account'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* USER PREFERENCES MODAL */}
          {isProfileModalOpen && (
            <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 relative">
                <button onClick={() => setIsProfileModalOpen(false)} class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                <h3 class="text-lg font-bold text-white mb-1">Account Preferences</h3>
                <p class="text-xs text-slate-400 mb-6">{session?.user.email}</p>

                <form onSubmit={handleSavePreferences} class="space-y-4">
                  <div>
                    <label class="block text-xs text-slate-400 mb-1">Public Display Name</label>
                    <input
                      type="text"
                      value={prefDisplayName}
                      onChange={(e) => setPrefDisplayName(e.target.value)}
                      class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                    />
                  </div>

                  <div class="flex items-center justify-between pt-2">
                    <span class="text-sm text-slate-300">Email Notifications</span>
                    <input
                      type="checkbox"
                      checked={prefNotifications}
                      onChange={(e) => setPrefNotifications(e.target.checked)}
                      class="w-4 h-4 accent-emerald-500 rounded"
                    />
                  </div>

                  <div class="pt-4 flex items-center justify-between gap-3 border-t border-slate-800">
                    <button type="button" onClick={handleSignOut} class="px-3.5 py-2 bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold rounded-lg hover:bg-red-500/20">
                      Sign Out
                    </button>
                    <button type="submit" class="px-5 py-2 bg-emerald-500 text-slate-950 text-xs font-bold rounded-lg hover:bg-emerald-400">
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* POST REVIEW MODAL */}
          {isReviewModalOpen && (
            <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 relative">
                <button onClick={() => setIsReviewModalOpen(false)} class="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                <h3 class="text-lg font-bold text-white mb-4">Post a Review</h3>

                <form onSubmit={handleAddReview} class="space-y-4">
                  <input
                    type="text"
                    required
                    placeholder="Domain (e.g. shopify.com)"
                    value={newDomainInput}
                    onChange={(e) => setNewDomainInput(e.target.value)}
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                  />
                  <div class="flex items-center gap-2">
                    {[1, 2, 3, 4, 5].map(star => (
                      <button type="button" key={star} onClick={() => setNewRating(star)} class={`text-2xl ${star <= newRating ? 'text-emerald-400' : 'text-slate-700'}`}>★</button>
                    ))}
                  </div>
                  <input
                    type="text"
                    required
                    placeholder="Review Title"
                    value={newTitle}
                    onChange={(e) => setNewTitle(e.target.value)}
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500"
                  />
                  <textarea
                    required
                    rows="3"
                    placeholder="Share details of your experience..."
                    value={newComment}
                    onChange={(e) => setNewComment(e.target.value)}
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-white resize-none focus:outline-none focus:border-emerald-500"
                  ></textarea>

                  <button type="submit" class="w-full py-2.5 bg-emerald-500 text-slate-950 text-sm font-bold rounded-lg hover:bg-emerald-400">
                    Submit Review
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<UnBoughtApp />);
  </script>
</body>
</html>
